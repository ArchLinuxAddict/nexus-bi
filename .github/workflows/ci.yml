name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CPU PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: |
          pip install numpy fastapi uvicorn pydantic jsonschema pyelftools python-multipart pytest httpx ruff
          pip install -e . --no-deps
      - name: Prepare test paths
        run: mkdir -p artifacts/dataset/realworld_so
      - name: Lint
        run: ruff check nexus tests scripts
      - name: Unit tests
        run: pytest tests/unit -q
