[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-bi"
version = "0.7.0"
description = "NEXUS-BI integrated binary intelligence platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "jsonschema>=4.22",
    "pyelftools>=0.33",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
model = ["torch>=2.4"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
nexus = "nexus.cli.main:main"

[tool.setuptools.packages.find]
include = ["nexus*", "nexus_train*"]

[tool.setuptools.package-data]
"nexus.dashboard" = ["*.html", "*.js", "*.css"]
"nexus" = ["../schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120
extend-exclude = [".venv", "artifacts", "models"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
